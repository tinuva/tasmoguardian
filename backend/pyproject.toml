[project]
name = "tasmomanager-backend"
version = "0.1.0"
description = "Self-hosted Tasmota device manager: backups, diffs, verified OTA updates"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.0",
    "decode-config==15.5.0.0",
    "aiomqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
